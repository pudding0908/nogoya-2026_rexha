<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>行程與購物清單</title>
  
  <!-- FontAwesome 圖標 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts 圓體字型 -->
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-base: #FFF0F5;         
      --card-bg: #FFFFFF;         
      --primary-color: #FFB7C5;   
      --primary-dark: #E898A6;    
      --accent-yellow: #FFF1C1;   
      --accent-purple: #E2D9F3;   
      --secondary-blue: #B5E2FA;  
      --text-dark: #5A5255;       
      --text-muted: #8C8285;      
      --time-text: #9A8C93;       
      --timeline-line: #FFD1DC;   
      --border-color: #FCE4EC;    
      --shadow-card: 0 8px 20px rgba(255, 183, 197, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Noto Sans TC', 'Quicksand', sans-serif;
    }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      background-color: var(--bg-base);
      color: var(--text-dark);
      line-height: 1.5;
      font-size: 16px;
      padding-bottom: 90px;
    }

    .fixed-header-group {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      z-index: 999;
      background-color: var(--bg-base);
      box-shadow: 0 4px 12px rgba(255, 183, 197, 0.15);
    }

    .header-content-wrapper {
      max-width: 600px;
      margin: 0 auto;
    }

    .header-card {
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-blue) 100%);
      color: #FFFFFF;
      padding: 14px 18px 12px 18px;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
      box-shadow: 0 4px 15px rgba(255, 183, 197, 0.4);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .header-subtitle {
      font-size: 13px;
      letter-spacing: 1.5px;
      color: #FFFFFF;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sync-btn {
      background: rgba(255, 255, 255, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.5);
      color: #FFFFFF;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }

    .header-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(4px);
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      color: #FFFFFF;
      font-weight: 500;
    }

    .date-tabs-wrapper {
      padding: 10px 12px;
      max-width: 600px;
      margin: 0 auto;
      background-color: var(--bg-base);
    }

    .date-tabs {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      width: 100%;
    }

    .tab-pill {
      flex: 1;
      background-color: #FFFFFF;
      border: 2px solid #FFD1DC;
      border-radius: 14px;
      padding: 6px 0;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(255, 183, 197, 0.15);
      transition: all 0.25s ease;
    }

    .tab-pill .pill-date {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary-dark);
      line-height: 1.1;
    }

    .tab-pill .pill-day {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .tab-pill.active {
      background-color: var(--primary-color);
      border-color: var(--primary-color);
      box-shadow: 0 4px 15px rgba(255, 183, 197, 0.5);
      transform: translateY(-2px);
    }

    .tab-pill.active .pill-date { color: #FFFFFF; }
    .tab-pill.active .pill-day { color: #FFF0F5; }

    main {
      max-width: 600px;
      margin: 0 auto;
      padding: 195px 12px 20px 12px;
    }

    .shopping-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .save-status-btn {
      background: linear-gradient(135deg, #A8E6CF 0%, #355C7D 100%);
      color: #FFFFFF;
      border: none;
      padding: 8px 14px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(53, 92, 125, 0.25);
    }

    .section-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--primary-dark);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .timeline-container {
      position: relative;
      padding-left: 68px;
    }

    .timeline-container::before {
      content: '';
      position: absolute;
      left: 54px;
      top: 18px;
      bottom: 24px;
      width: 3px;
      background-color: var(--timeline-line);
      border-radius: 3px;
      z-index: 1;
    }

    .timeline-item {
      position: relative;
      margin-bottom: 24px;
    }

    .time-start, .time-end {
      position: absolute;
      left: -68px;
      width: 50px;
      text-align: right;
      font-size: 14px;
      font-weight: 700;
      color: var(--time-text);
    }

    .time-start { top: 2px; }
    .time-end { bottom: 2px; }

    .timeline-node {
      position: absolute;
      left: -14px;
      top: 9px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #FFFFFF;
      border: 3px solid var(--primary-color);
      z-index: 2;
      transform: translateX(-50%);
      box-shadow: 0 0 8px rgba(255, 183, 197, 0.8);
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-card);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-dark);
      line-height: 1.35;
      flex: 1;
    }

    .category-tag {
      font-size: 12px;
      font-weight: 700;
      color: #5A5255;
      padding: 4px 10px;
      border-radius: 12px;
      white-space: nowrap;
    }

    .tag-景點 { background-color: #FFD1DC; color: #8C525C; }
    .tag-餐飲, .tag-美食 { background-color: #FFE5B4; color: #8C6D47; }
    .tag-住宿 { background-color: #C1F0F6; color: #407A85; }
    .tag-交通 { background-color: #E2D9F3; color: #5C4B7D; }
    .tag-購物 { background-color: #D4F0F0; color: #3F7070; }
    .tag-重要 { background-color: #FFF5BA; color: #857930; }

    .card-desc {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 13px;
      color: var(--text-muted);
      background-color: #FFF8FA;
      padding: 10px 14px;
      border-radius: 14px;
      border: 1px dashed #FFD1DC;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .map-btn {
      background-color: #FFF0F3;
      color: var(--primary-dark);
      border: 1px solid #FFD1DC;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
    }

    .card-image-wrapper {
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      margin-top: 6px;
      background: #FFFFFF;
      border: 1px solid #FCE4EC;
      padding: 4px;
    }

    .card-image {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      display: block;
      border-radius: 10px;
    }

    /* ---------------- 交通卡片樣式 ---------------- */
    .traffic-card {
      background-color: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-card);
      overflow: hidden;
      margin-bottom: 20px;
    }

    .traffic-header {
      background: linear-gradient(135deg, #E2D9F3 0%, #B5E2FA 100%);
      padding: 12px 18px;
      font-size: 16px;
      font-weight: 700;
      color: #5C4B7D;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .traffic-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .traffic-summary-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 8px;
    }

    .traffic-summary-station {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-width: 80px;
    }

    .traffic-summary-station.end {
      align-items: flex-end;
    }

    .summary-time {
      font-size: 22px;
      font-weight: 800;
      color: #5C4B7D;
      line-height: 1.1;
    }

    .summary-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-dark);
      margin-top: 2px;
    }

    .traffic-summary-line-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 12px;
    }

    .summary-line-desc {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 2px;
      text-align: center;
    }

    .summary-line-track {
      width: 100%;
      height: 2px;
      background-color: #D4C5E2;
      position: relative;
      margin: 4px 0;
    }

    .summary-line-track::after {
      content: '';
      position: absolute;
      right: -2px;
      top: -3px;
      width: 0;
      height: 0;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      border-left: 6px solid #D4C5E2;
    }

    .summary-duration {
      font-size: 12px;
      font-weight: 700;
      color: #5C4B7D;
      margin-top: 2px;
    }

    .traffic-note-bubble {
      background-color: #FAF5F9;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      border: 1px solid #F5E6ED;
    }

    .traffic-note-bubble i {
      color: var(--primary-dark);
      margin-top: 3px;
      font-size: 14px;
    }

    .traffic-image-container {
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      background: #FFFFFF;
      border: 1px solid #E2D9F3;
      padding: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .traffic-image {
      max-width: 100%;
      max-height: 320px;
      object-fit: contain;
      display: block;
      border-radius: 8px;
    }

    /* ---------------- 購物清單專屬樣式 ---------------- */
    .shopping-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    .store-group-card {
      background: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }

    .store-header {
      background: linear-gradient(135deg, #FFE5B4 0%, #FFD1DC 100%);
      padding: 12px 18px;
      font-size: 16px;
      font-weight: 700;
      color: #5A5255;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .store-header i.fa-chevron-down {
      transition: transform 0.3s ease;
    }

    .store-group-card.open .store-header i.fa-chevron-down {
      transform: rotate(180deg);
    }

    .store-items-list {
      display: none;
      padding: 14px 18px;
      flex-direction: column;
      gap: 16px;
    }

    .store-group-card.open .store-items-list {
      display: flex;
    }

    .completed-icon {
      color: #2ECC71;
      font-size: 16px;
      margin-right: 4px;
    }

    .product-card {
      background: #FFF9FB;
      border: 1px solid #FCE4EC;
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .product-row-1 {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .product-titles h4 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-dark);
      line-height: 1.35;
      display: flex;
      align-items: center;
    }

    .product-titles .jp-title-inline {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
      margin-left: 4px;
    }

    .product-image-container {
      width: 100%;
      max-height: 140px;
      display: none;
      justify-content: center;
      align-items: center;
      background: #FFFFFF;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 2px;
      border: 1px solid #F7E4EB;
      padding: 6px;
    }

    .product-image {
      max-width: 100%;
      max-height: 130px;
      object-fit: contain;
      display: block;
    }

    .product-order-box {
      font-size: 13px;
      font-weight: 700;
      color: #855300;
      background: linear-gradient(135deg, #FFF5BA 0%, #FFE5B4 100%);
      border: 1px solid #FFE0B2;
      padding: 8px 12px;
      border-radius: 10px;
      margin-top: 2px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-self: flex-start;
      box-shadow: 0 2px 6px rgba(255, 183, 0, 0.12);
    }

    .product-order-box-title {
      font-size: 12px;
      color: #8C525C;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 2px;
    }

    .product-order-item {
      display: flex;
      align-items: center;
      gap: 6px;
      line-height: 1.3;
    }

    .product-row-style {
      font-size: 13px;
      color: var(--text-dark);
      background: #FFFFFF;
      border: 1px solid #F7E4EB;
      padding: 3px 8px;
      border-radius: 6px;
      width: fit-content;
      font-weight: 500;
    }

    .product-row-prices {
      font-size: 13px;
      color: var(--text-dark);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .product-row-prices strong {
      color: var(--primary-dark);
    }

    .product-row-note {
      font-size: 12px;
      color: var(--text-muted);
      white-space: pre-line;
      word-break: break-all;
    }

    .product-row-link {
      font-size: 12px;
    }

    .sub-box {
      margin-top: 4px;
      padding-top: 8px;
      border-top: 1px dashed #FCE4EC;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sub-title {
      font-size: 12px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      width: fit-content;
    }

    .sub-title.order { background-color: #E2F0D9; color: #276A3C; }

    .buyer-group {
      background-color: #FFF5F7;
      border: 1px solid #F7D6E0;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .buyer-group-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-dark);
      padding: 8px 12px;
      background: #FFEBF0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .buyer-group-title i.fa-chevron-down {
      font-size: 12px;
      transition: transform 0.25s ease;
    }

    .buyer-group.open .buyer-group-title i.fa-chevron-down {
      transform: rotate(180deg);
    }

    .buyer-items-container {
      display: none;
      padding: 8px 12px;
      flex-direction: column;
      gap: 8px;
      border-top: 1px dashed #F7C8D8;
    }

    .buyer-group.open .buyer-items-container {
      display: flex;
    }

    .buyer-progress-badge {
      font-size: 11px;
      font-weight: 700;
      color: #276A3C;
      background: #E2F0D9;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .sub-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      padding: 4px 0;
      cursor: pointer;
      user-select: none;
    }

    .sub-row.completed .sub-text {
      text-decoration: line-through;
      color: #A0989B;
    }

    .custom-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--primary-dark);
      flex-shrink: 0;
    }

    .sub-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .note-input {
      border: 1px solid #FFC0CB;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 12px;
      color: var(--text-dark);
      outline: none;
      width: 130px;
      background-color: #FFFFFF;
      transition: border-color 0.2s ease;
    }

    .note-input:focus {
      border-color: var(--primary-dark);
      box-shadow: 0 0 4px rgba(232, 152, 166, 0.4);
    }

    .bottom-nav-wrapper {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background-color: var(--bg-base);
      padding: 6px 12px 10px 12px;
    }

    .bottom-nav {
      max-width: 600px;
      margin: 0 auto;
      background: #FFFFFF;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      box-shadow: 0 -4px 15px rgba(255, 183, 197, 0.2);
      border-radius: 20px;
      border: 1px solid var(--border-color);
    }

    .bottom-nav-item {
      flex: 1;
      text-align: center;
      background: none;
      border: none;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .bottom-nav-item i {
      font-size: 20px;
    }

    .bottom-nav-item.active {
      color: var(--primary-dark);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    .empty-state i {
      font-size: 40px;
      color: #FFD1DC;
      margin-bottom: 10px;
    }

    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- 固定頂部區 -->
  <div class="fixed-header-group" id="header-group">
    <div class="header-content-wrapper">
      <div class="header-card">
        <div class="header-top">
          <div class="header-subtitle">
            夢幻隨行手帳 TRIP MEMO
          </div>
          <button class="sync-btn" onclick="fetchAllData(true)">
            <i class="fa-solid fa-rotate" id="sync-icon"></i>
            <span>同步資料</span>
          </button>
        </div>
        <div class="header-title">
          <i class="fa-solid fa-plane"></i> 日本中部獨旅
        </div>
        <div class="header-pill">
          <i class="fa-regular fa-calendar-days"></i> 愛麗絲雲朵旅物所 初登場 2026/10/16-20
        </div>
      </div>

      <div class="date-tabs-wrapper" id="date-tabs-wrapper">
        <div class="date-tabs" id="date-tabs"></div>
      </div>
    </div>
  </div>

  <main id="main-content">
    <!-- 動態內容區 -->
  </main>

  <!-- 底部導覽列 -->
  <div class="bottom-nav-wrapper">
    <nav class="bottom-nav">
      <button class="bottom-nav-item active" id="nav-itinerary" onclick="switchMainTab('itinerary')">
        <i class="fa-solid fa-map-location-dot"></i>
        <span>行程</span>
      </button>
      <button class="bottom-nav-item" id="nav-traffic" onclick="switchMainTab('traffic')">
        <i class="fa-solid fa-train-subway"></i>
        <span>交通</span>
      </button>
      <button class="bottom-nav-item" id="nav-shopping" onclick="switchMainTab('shopping')">
        <i class="fa-solid fa-bag-shopping"></i>
        <span>購物</span>
      </button>
    </nav>
  </div>

  <script>
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }

    const ITINERARY_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTrCVDD_KzsJrMST5sAZARew0U6HSu08xYD45xVgRxmPISj7JsrEWJh_CAwPXOxOTFmrTiOz9NTqqih/pub?gid=1604718346&single=true&output=csv";
    const SHOPPING_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTrCVDD_KzsJrMST5sAZARew0U6HSu08xYD45xVgRxmPISj7JsrEWJh_CAwPXOxOTFmrTiOz9NTqqih/pub?gid=1409318811&single=true&output=csv";
    const ORDERS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTrCVDD_KzsJrMST5sAZARew0U6HSu08xYD45xVgRxmPISj7JsrEWJh_CAwPXOxOTFmrTiOz9NTqqih/pub?gid=173335899&single=true&output=csv";
    
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx8nTfpX8ZkIrjtzUY5fWJQ9SEo6vtFF1_XREHNRycadYLh-Vy9LI95Yt-6end5UYtWlQ/exec";

    let currentMainTab = 'itinerary';
    let currentDay = 1;
    let itineraryData = {};
    let dayDates = {};
    let wishData = [];
    let orderData = [];
    let checkedMap = {}; 
    let noteMap = {}; 
    let expandedStores = {}; 
    let expandedBuyers = {}; 

    window.onload = function() {
      window.scrollTo(0, 0);
      loadCache();
      expandedStores = {};
      fetchAllData(false);
    };

    function loadCache() {
      const cached = localStorage.getItem('trip_app_cache_v54');
      if (cached) {
        try {
          const parsed = JSON.parse(cached);
          itineraryData = parsed.itineraryData || {};
          dayDates = parsed.dayDates || {};
          wishData = parsed.wishData || [];
          orderData = parsed.orderData || [];
          checkedMap = parsed.checkedMap || {};
          noteMap = parsed.noteMap || {};
          expandedBuyers = parsed.expandedBuyers || {};
          renderView();
        } catch(e) {}
      }
    }

    function saveCache() {
      localStorage.setItem('trip_app_cache_v54', JSON.stringify({
        itineraryData, dayDates, wishData, orderData, checkedMap, noteMap, expandedBuyers
      }));
    }

    function fetchAllData(isManual = false) {
      const syncIcon = document.getElementById('sync-icon');
      if (syncIcon) syncIcon.classList.add('spin');

      Promise.all([
        fetch(ITINERARY_CSV_URL + "&t=" + new Date().getTime()).then(res => res.text()),
        fetch(SHOPPING_CSV_URL + "&t=" + new Date().getTime()).then(res => res.text()).catch(() => ""),
        fetch(ORDERS_CSV_URL + "&t=" + new Date().getTime()).then(res => res.text()).catch(() => "")
      ])
      .then(([itineraryText, shoppingText, ordersText]) => {
        parseItineraryCSV(itineraryText);
        if (shoppingText) parseShoppingWishCSV(shoppingText);
        if (ordersText) parseOrdersCSV(ordersText);
        saveCache();
        renderView();
        if (isManual) alert("🌸 資料同步更新成功！");
      })
      .catch(err => {
        console.error(err);
        if (isManual) alert("🥺 同步失敗，請確認網路連線。");
      })
      .finally(() => {
        if (syncIcon) syncIcon.classList.remove('spin');
      });
    }

    function syncStatusToSheet() {
      if (!GAS_WEB_APP_URL) {
        alert("請設定 Apps Script Web App 網址！");
        return;
      }

      const btnIcon = document.getElementById('upload-icon');
      if (btnIcon) btnIcon.classList.add('spin');

      // 打包所有訂單的目前狀態與備註，發送至後端
      const payloadItems = orderData.map(o => {
        return {
          store: o.store,
          item: o.item,
          style: o.style,
          buyer: o.buyer,
          checked: !!checkedMap[o.id],
          note: noteMap[o.id] !== undefined ? noteMap[o.id] : (o.note || '')
        };
      });

      fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items: payloadItems })
      })
      .then(() => {
        alert("✨ 採購狀態與備註已發送更新至 Google Sheet！");
      })
      .catch(err => {
        console.error(err);
        alert("🥺 更新失敗，請檢查網路連線。");
      })
      .finally(() => {
        if (btnIcon) btnIcon.classList.remove('spin');
      });
    }

    function parseCSV(text) {
      const result = [[]];
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        let cur = text[i], next = text[i + 1];
        if (cur === '"') {
          if (inQuotes && next === '"') { 
            result[result.length - 1][result[result.length - 1].length - 1] += '"'; 
            i++; 
          } else { 
            inQuotes = !inQuotes; 
          }
        } else if (cur === ',' && !inQuotes) {
          result[result.length - 1].push('');
        } else if ((cur === '\r' || cur === '\n') && !inQuotes) {
          if (cur === '\r' && next === '\n') { i++; }
          result.push(['']);
        } else {
          if (result[result.length - 1].length === 0) result[result.length - 1].push('');
          result[result.length - 1][result[result.length - 1].length - 1] += cur;
        }
      }
      return result;
    }

    function processAssetUrl(inputVal, titleVal, folderName) {
      let fileName = inputVal ? inputVal.trim() : titleVal.trim();
      if (!fileName) return '';
      if (fileName.startsWith('http://') || fileName.startsWith('https://')) {
        return fileName;
      }
      if (!fileName.includes('.')) {
        return `${folderName}/${fileName}.jpg`;
      }
      return `${folderName}/${fileName}`;
    }

    function parseItineraryCSV(csvText) {
      const rows = parseCSV(csvText);
      if (rows.length < 2) return;

      const newItinerary = {};
      const newDayDates = {};
      let activeDay = 1;
      let lastDate = "";

      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];
        if (!row || row.length < 5) continue;

        let rawDate = row[0] ? row[0].trim() : '';
        let dayNum = parseInt(row[1]) || parseInt(row[0]);

        if (!dayNum || isNaN(dayNum)) continue;
        activeDay = dayNum;

        if (rawDate) lastDate = rawDate;
        if (!newDayDates[activeDay] && lastDate) newDayDates[activeDay] = lastDate;
        if (!newItinerary[activeDay]) newItinerary[activeDay] = [];

        const timeStart = row[2] ? row[2].trim() : '';
        const timeEnd = row[3] ? row[3].trim() : '';
        const title = row[4] ? row[4].trim() : '';
        if (!title) continue;

        const category = row[5] ? row[5].trim() : '景點';
        const desc = row[6] ? row[6].trim() : '';
        const duration = row[7] ? row[7].trim() : '';
        
        const cost = row[8] ? row[8].trim() : '';
        const note = row[9] ? row[9].trim() : '';
        const mapUrl = row[10] ? row[10].trim() : '';
        
        const rawImgInput = row[11] ? row[11].trim() : '';
        const rawTrafficInput = row[12] ? row[12].trim() : '';

        const imageUrl = processAssetUrl(rawImgInput, title, 'travel');
        const trafficUrl = processAssetUrl(rawTrafficInput, title, 'traffic');

        newItinerary[activeDay].push({
          timeStart, timeEnd, title, category, desc, duration, cost, note, mapUrl, imageUrl, trafficUrl
        });
      }

      itineraryData = newItinerary;
      dayDates = newDayDates;
    }

    function processShoppingImageUrl(url, store, item) {
      if (url) {
        if (url.startsWith('http://') || url.startsWith('https://')) {
          return url;
        }
        return `images/${url}`;
      }
      return `images/${store}_${item}.png`;
    }

    function parseShoppingWishCSV(csvText) {
      const rows = parseCSV(csvText);
      if (rows.length < 2) return;
      
      let headerRowIndex = -1;
      let headers = [];
      
      for (let i = 0; i < Math.min(rows.length, 3); i++) {
        const row = rows[i];
        if (row && (row.includes('店家') || row.includes('商品'))) {
          headerRowIndex = i;
          headers = row.map(h => h ? h.trim() : '');
          break;
        }
      }

      if (headerRowIndex === -1) {
        headerRowIndex = 1;
        headers = rows[1] ? rows[1].map(h => h ? h.trim() : '') : [];
      }

      const getColIdxByKeyword = (keywords) => {
        for (let kw of keywords) {
          for (let i = 0; i < headers.length; i++) {
            if (headers[i].includes(kw)) return i;
          }
        }
        return -1;
      };

      const idxStore = getColIdxByKeyword(['店家', '店名']);
      const idxItem = getColIdxByKeyword(['商品', '品名']);
      const idxItemJp = getColIdxByKeyword(['日文', '外文']);
      const idxStyle = getColIdxByKeyword(['款式', '規格', '顏色']);
      const idxQty = getColIdxByKeyword(['數量', '數']);
      const idxUnTaxed = getColIdxByKeyword(['未稅']);
      const idxTaxed = getColIdxByKeyword(['含稅']);
      const idxPriceRef = getColIdxByKeyword(['台幣', '參考']);
      const idxPriceOffer = getColIdxByKeyword(['開價', '售價', '價格']);
      const idxNote = getColIdxByKeyword(['備註', '說明']);
      const idxLink = getColIdxByKeyword(['連結', '網址']);
      const idxImage = getColIdxByKeyword(['圖片', '相片', '照片']);

      const list = [];
      
      for (let i = headerRowIndex + 1; i < rows.length; i++) {
        const row = rows[i];
        if (!row || row.length === 0) continue;
        
        const store = idxStore !== -1 && row[idxStore] ? row[idxStore].trim() : ''; 
        const item = idxItem !== -1 && row[idxItem] ? row[idxItem].trim() : '';  
        if (!store || !item || store === '店家' || item === '商品') continue;

        let rawImg = idxImage !== -1 && row[idxImage] ? row[idxImage].trim() : '';
        let finalImageUrl = processShoppingImageUrl(rawImg, store, item);

        list.push({ 
          store: store,
          item: item,
          itemJp: idxItemJp !== -1 && row[idxItemJp] ? row[idxItemJp].trim() : '',      
          style: idxStyle !== -1 && row[idxStyle] ? row[idxStyle].trim() : '',       
          qty: idxQty !== -1 && row[idxQty] !== "" && !isNaN(row[idxQty]) ? parseInt(row[idxQty]) : 0,               
          unTaxed: idxUnTaxed !== -1 && row[idxUnTaxed] ? row[idxUnTaxed].trim() : '',     
          taxed: idxTaxed !== -1 && row[idxTaxed] ? row[idxTaxed].trim() : '',       
          priceRef: idxPriceRef !== -1 && row[idxPriceRef] ? row[idxPriceRef].trim() : '',    
          priceOffer: idxPriceOffer !== -1 && row[idxPriceOffer] ? row[idxPriceOffer].trim() : '',  
          note: idxNote !== -1 && row[idxNote] ? row[idxNote].trim() : '',      
          link: idxLink !== -1 && row[idxLink] ? row[idxLink].trim() : '',      
          image: finalImageUrl      
        });
      }
      wishData = list;
    }

    function parseOrdersCSV(csvText) {
      const rows = parseCSV(csvText);
      if (rows.length < 2) return;

      let headerRowIndex = -1;
      let headers = [];
      
      for (let i = 0; i < Math.min(rows.length, 3); i++) {
        const row = rows[i];
        if (row && (row.includes('店家') || row.includes('商品') || row.includes('下單人'))) {
          headerRowIndex = i;
          headers = row.map(h => h ? h.trim() : '');
          break;
        }
      }

      if (headerRowIndex === -1) {
        headerRowIndex = 1;
        headers = rows[1] ? rows[1].map(h => h ? h.trim() : '') : [];
      }

      const getColIdx = (names) => {
        for (let name of names) {
          let idx = headers.indexOf(name);
          if (idx !== -1) return idx;
        }
        return -1;
      };

      const idxStatus = getColIdx(['完成', '狀態', '已購買']);
      const idxBuyer = getColIdx(['許願人', '下單人']);
      const idxStore = getColIdx(['店家']);
      const idxItem = getColIdx(['商品']);
      const idxStyle = getColIdx(['款式']);
      const idxQty = getColIdx(['數量', '下單數量']);
      const idxPrice = getColIdx(['親友價', '單價']);
      const idxTotal = getColIdx(['總價']);
      const idxNote = getColIdx(['備註']);

      const list = [];
      
      for (let i = headerRowIndex + 1; i < rows.length; i++) {
        const row = rows[i];
        if (!row || row.length === 0) continue;
        
        const status = idxStatus !== -1 && row[idxStatus] ? row[idxStatus].trim() : '';  
        const buyer = idxBuyer !== -1 && row[idxBuyer] ? row[idxBuyer].trim() : '';   
        const store = idxStore !== -1 && row[idxStore] ? row[idxStore].trim() : '';   
        const item = idxItem !== -1 && row[idxItem] ? row[idxItem].trim() : '';    
        
        if (!store || !item || store === '店家' || item === '商品') continue;

        const style = idxStyle !== -1 && row[idxStyle] ? row[idxStyle].trim() : '';  
        const qty = (idxQty !== -1 && parseInt(row[idxQty])) ? parseInt(row[idxQty]) : 1;          
        const csvNote = idxNote !== -1 && row[idxNote] ? row[idxNote].trim() : '';

        const id = `ord_${i}_${store}_${item}_${style}_${buyer}`;

        // 確保從 CSV 讀取到已打勾狀態時同步更新到 checkedMap
        if (status === "已購買" || status.toLowerCase() === "true" || status === "☑" || status === "TRUE" || status === "已買") {
          checkedMap[id] = true;
        } else if (checkedMap[id] === undefined) {
          checkedMap[id] = false;
        }

        if (noteMap[id] === undefined) {
          noteMap[id] = csvNote;
        }

        list.push({
          id: id,
          buyer: buyer,
          store: store,
          item: item,
          style: style,
          qty: qty,
          price: idxPrice !== -1 && row[idxPrice] ? row[idxPrice].trim() : '',       
          total: idxTotal !== -1 && row[idxTotal] ? row[idxTotal].trim() : '',       
          note: csvNote         
        });
      }
      orderData = list;
    }

    function switchMainTab(tab) {
      currentMainTab = tab;
      document.getElementById('nav-itinerary').classList.toggle('active', tab === 'itinerary');
      document.getElementById('nav-traffic').classList.toggle('active', tab === 'traffic');
      document.getElementById('nav-shopping').classList.toggle('active', tab === 'shopping');
      
      const dateTabsWrapper = document.getElementById('date-tabs-wrapper');
      const mainContent = document.getElementById('main-content');

      if (tab === 'itinerary' || tab === 'traffic') {
        dateTabsWrapper.style.display = 'block';
        mainContent.style.paddingTop = '195px';
      } else {
        expandedStores = {};
        dateTabsWrapper.style.display = 'none';
        mainContent.style.paddingTop = '145px';
      }
      renderView();
      window.scrollTo(0, 0);
    }

    function switchDay(day) {
      currentDay = day;
      renderTabs();
      if (currentMainTab === 'itinerary') {
        renderItineraryDay(day);
      } else if (currentMainTab === 'traffic') {
        renderTrafficDay(day);
      }
      window.scrollTo(0, 0);
    }

    function toggleCheck(id) {
      checkedMap[id] = !checkedMap[id];
      saveCache();
      renderShoppingList();
    }

    function updateNote(id, value) {
      noteMap[id] = value;
      saveCache();
    }

    function toggleStoreElement(element, storeName) {
      const card = element.closest('.store-group-card');
      if (card) {
        card.classList.toggle('open');
        expandedStores[storeName] = card.classList.contains('open');
      }
    }

    function toggleBuyerElement(element, buyerKey) {
      const group = element.closest('.buyer-group');
      if (group) {
        group.classList.toggle('open');
        expandedBuyers[buyerKey] = group.classList.contains('open');
        saveCache();
      }
    }

    function renderView() {
      const dateTabsWrapper = document.getElementById('date-tabs-wrapper');
      const mainContent = document.getElementById('main-content');

      if (currentMainTab === 'itinerary') {
        dateTabsWrapper.style.display = 'block';
        mainContent.style.paddingTop = '195px';
        renderTabs();
        renderItineraryDay(currentDay);
      } else if (currentMainTab === 'traffic') {
        dateTabsWrapper.style.display = 'block';
        mainContent.style.paddingTop = '195px';
        renderTabs();
        renderTrafficDay(currentDay);
      } else {
        dateTabsWrapper.style.display = 'none';
        mainContent.style.paddingTop = '145px';
        renderShoppingList();
      }
    }

    function renderTabs() {
      const tabsContainer = document.getElementById('date-tabs');
      let html = '';
      const days = Object.keys(itineraryData).map(Number).sort((a, b) => a - b);
      if (days.length === 0) { tabsContainer.innerHTML = ''; return; }

      if (!itineraryData[currentDay]) currentDay = days[0];

      days.forEach(day => {
        let dateStr = dayDates[day] || `Day ${day}`;
        let isActive = (day === currentDay) ? 'active' : '';
        html += `
          <div class="tab-pill ${isActive}" onclick="switchDay(${day})">
            <span class="pill-date">${dateStr}</span>
            <span class="pill-day">Day ${day}</span>
          </div>
        `;
      });
      tabsContainer.innerHTML = html;
    }

    function renderItineraryDay(day) {
      const container = document.getElementById('main-content');
      const list = itineraryData[day] || [];

      let html = `<div class="section-title" style="max-width:600px; margin:0 auto 14px auto;"><i class="fa-solid fa-route"></i> 行程時光軸 (Day ${day})</div><div class="timeline-container" style="max-width:600px; margin:0 auto;">`;

      if (list.length === 0) {
        container.innerHTML = `<div class="empty-state"><i class="fa-regular fa-folder-open"></i><p>第 ${day} 天暫無行程資料</p></div>`;
        return;
      }

      list.forEach(item => {
        let metaHtml = '';
        if (item.duration) metaHtml += `<div class="meta-item"><i class="fa-regular fa-clock"></i> 歷時: <strong>${item.duration}</strong></div>`;
        if (item.cost) metaHtml += `<div class="meta-item"><i class="fa-solid fa-yen-sign"></i> 費用: <strong>${item.cost}</strong></div>`;
        if (item.note) metaHtml += `<div class="meta-item" style="width:100%;"><i class="fa-regular fa-note-sticky"></i> 備註: ${item.note}</div>`;

        let imgHtml = item.imageUrl ? `
          <div class="card-image-wrapper">
            <img src="${item.imageUrl}" class="card-image" referrerpolicy="no-referrer" 
                 onload="this.closest('.card-image-wrapper').style.display='block';"
                 onerror="
                   if (this.src.endsWith('.jpg')) {
                     this.src = this.src.replace('.jpg', '.png');
                   } else if (this.src.endsWith('.png')) {
                     this.src = this.src.replace('.png', '.JPG');
                   } else {
                     this.closest('.card-image-wrapper').style.display='none';
                   }
                 ">
          </div>
        ` : '';

        let mapSearchUrl = item.mapUrl || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.title)}`;

        html += `
          <div class="timeline-item">
            <div class="time-start">${item.timeStart || ''}</div>
            <div class="time-end">${item.timeEnd || ''}</div>
            <div class="timeline-node"></div>
            <div class="card">
              <div class="card-header">
                <div class="card-title">${item.title}</div>
                <span class="category-tag tag-${item.category}">${item.category}</span>
              </div>
              ${item.desc ? `<div class="card-desc">${item.desc}</div>` : ''}
              ${metaHtml ? `<div class="card-meta">${metaHtml}</div>` : ''}
              <div><a href="${mapSearchUrl}" target="_blank" class="map-btn"><i class="fa-solid fa-location-dot"></i> 地圖導航</a></div>
              ${imgHtml}
            </div>
          </div>
        `;
      });

      html += `</div>`;
      container.innerHTML = html;
    }

    function renderTrafficDay(day) {
      const container = document.getElementById('main-content');
      const list = (itineraryData[day] || []).filter(item => item.category === '交通');

      let html = `<div style="max-width:600px; margin:0 auto;">`;
      html += `<div class="section-title" style="margin-bottom:14px;"><i class="fa-solid fa-train-subway"></i> 交通指引 (Day ${day})</div>`;

      if (list.length === 0) {
        html += `<div class="empty-state"><i class="fa-solid fa-train"></i><p>第 ${day} 天無交通分類資料</p></div>`;
        html += `</div>`;
        container.innerHTML = html;
        return;
      }

      list.forEach(item => {
        let startStation = "起點站";
        let endStation = "終點站";
        if (item.title.includes('→')) {
          const parts = item.title.split('→');
          startStation = parts[0].trim();
          endStation = parts[1].trim();
        } else if (item.title.includes(' - ')) {
          const parts = item.title.split(' - ');
          startStation = parts[0].trim();
          endStation = parts[1].trim();
        } else {
          startStation = item.title;
          endStation = '';
        }

        let trafficImgHtml = item.trafficUrl ? `
          <div class="traffic-image-container">
            <img src="${item.trafficUrl}" class="traffic-image" referrerpolicy="no-referrer" 
                 onload="this.closest('.traffic-image-container').style.display='flex';"
                 onerror="
                   if (this.src.endsWith('.jpg')) {
                     this.src = this.src.replace('.jpg', '.png');
                   } else if (this.src.endsWith('.png')) {
                     this.src = this.src.replace('.png', '.JPG');
                   } else {
                     this.closest('.traffic-image-container').style.display='none';
                   }
                 ">
          </div>
        ` : '';

        let notesText = [];
        if (item.note) notesText.push(item.note);
        if (item.cost) notesText.push(`費用: ${item.cost}`);
        let combinedNotes = notesText.join(' ｜ ');

        html += `
          <div class="traffic-card">
            <div class="traffic-header">
              <span><i class="fa-solid fa-route"></i> ${item.title}</span>
              <span class="category-tag tag-交通" style="background:#FFFFFF;">交通</span>
            </div>
            
            <div class="traffic-body">
              <div class="traffic-summary-box">
                <div class="traffic-summary-station">
                  <span class="summary-time">${item.timeStart || '--:--'}</span>
                  <span class="summary-name">${startStation}</span>
                </div>
                
                <div class="traffic-summary-line-wrapper">
                  <span class="summary-line-desc">${item.desc || '大眾運輸'}</span>
                  <div class="summary-line-track"></div>
                  ${item.duration ? `<span class="summary-duration">${item.duration}</span>` : ''}
                </div>
                
                <div class="traffic-summary-station end">
                  <span class="summary-time">${item.timeEnd || '--:--'}</span>
                  <span class="summary-name">${endStation}</span>
                </div>
              </div>

              ${combinedNotes ? `
                <div class="traffic-note-bubble">
                  <i class="fa-solid fa-circle-info"></i>
                  <span>${combinedNotes}</span>
                </div>
              ` : ''}

              ${trafficImgHtml}
            </div>
          </div>
        `;
      });

      html += `</div>`;
      container.innerHTML = html;
    }

    function renderShoppingList() {
      const container = document.getElementById('main-content');
      let html = `<div class="shopping-container">`;

      html += `
        <div class="shopping-top-bar">
          <div class="section-title"><i class="fa-solid fa-basket-shopping"></i> 購物與採購清單</div>
          <button class="save-status-btn" onclick="syncStatusToSheet()">
            <i class="fa-solid fa-cloud-arrow-up" id="upload-icon"></i>
            <span>更新採購狀態</span>
          </button>
        </div>
      `;
      
      const allStores = Array.from(new Set([
        ...wishData.map(w => w.store),
        ...orderData.map(o => o.store)
      ]));

      if (allStores.length === 0) {
        html += `<div class="empty-state"><i class="fa-solid fa-bag-shopping"></i><p>目前沒有購物清單資料</p></div>`;
        container.innerHTML = html;
        return;
      }

      allStores.forEach(storeName => {
        const storeWishes = wishData.filter(w => w.store === storeName);
        const storeOrders = orderData.filter(o => o.store === storeName);

        const productNames = Array.from(new Set([
          ...storeWishes.map(w => w.item),
          ...storeOrders.map(o => o.item)
        ]));

        const completedCount = storeOrders.filter(o => checkedMap[o.id]).length;
        const isStoreOpen = expandedStores[storeName] === true;

        html += `
          <div class="store-group-card ${isStoreOpen ? 'open' : ''}">
            <div class="store-header" onclick="toggleStoreElement(this, '${storeName}')">
              <span><i class="fa-solid fa-store"></i> ${storeName}</span>
              <div style="display: flex; align-items: center; gap: 8px;">
                ${storeOrders.length > 0 ? `<span style="font-size: 12px; font-weight: 700; background: rgba(255,255,255,0.85); color: #276A3C; padding: 2px 8px; border-radius: 10px;">採購進度: ${completedCount}/${storeOrders.length}</span>` : ''}
                <i class="fa-solid fa-chevron-down"></i>
              </div>
            </div>
            <div class="store-items-list">
        `;

        productNames.forEach(prodName => {
          const itemWishes = storeWishes.filter(w => w.item === prodName);
          const itemOrders = storeOrders.filter(o => o.item === prodName);

          const isItemAllCompleted = itemOrders.length > 0 && itemOrders.every(o => checkedMap[o.id]);

          const styleQtyMap = {};
          let totalQtyNoStyle = 0;
          let hasStyleInOrders = false;

          itemOrders.forEach(o => {
            if (o.style && o.style !== '-') {
              styleQtyMap[o.style] = (styleQtyMap[o.style] || 0) + o.qty;
              hasStyleInOrders = true;
            } else {
              totalQtyNoStyle += o.qty;
            }
          });

          let orderStyleItems = [];
          if (hasStyleInOrders) {
            Object.keys(styleQtyMap).forEach(st => {
              if (st && st !== '-') {
                orderStyleItems.push(`${st}: ${styleQtyMap[st]}`);
              }
            });
            if (totalQtyNoStyle > 0) {
              orderStyleItems.push(`總計: ${totalQtyNoStyle}`);
            }
          } else if (totalQtyNoStyle > 0) {
            orderStyleItems.push(`總計: ${totalQtyNoStyle}`);
          }

          let taxed = '', unTaxed = '', priceRef = '', priceOffer = '', globalNote = '', link = '', image = '';
          itemWishes.forEach(w => {
            if (!taxed && w.taxed) taxed = w.taxed;
            if (!unTaxed && w.unTaxed) unTaxed = w.unTaxed;
            if (!priceRef && w.priceRef) priceRef = w.priceRef;
            if (!priceOffer && w.priceOffer) priceOffer = w.priceOffer;
            if (!globalNote && w.note) globalNote = w.note;
            if (!link && w.link) link = w.link;
            if (!image && w.image) image = w.image;
          });

          const refWish = itemWishes[0] || {};
          const itemJp = refWish.itemJp || '';
          
          const wishStyles = Array.from(new Set(
            itemWishes.map(w => w.style).filter(st => st && st !== '-')
          )).join('、');

          let priceParts = [];
          if (taxed) priceParts.push(`含稅: <strong>${taxed}</strong>`);
          if (unTaxed) priceParts.push(`未稅: <strong>${unTaxed}</strong>`);
          if (priceRef) {
            const cleanRef = priceRef.replace(/[^0-9.]/g, '') || priceRef;
            priceParts.push(`<span style="color:var(--text-muted); font-weight:normal;">(約台幣$${cleanRef})</span>`);
          }
          if (priceOffer) priceParts.push(`開價: <strong>${priceOffer}</strong>`);

          const styleHtml = (wishStyles && wishStyles.trim() !== '' && wishStyles.trim() !== '-') 
            ? `<div class="product-row-style"><i class="fa-solid fa-tag"></i> 款式: ${wishStyles}</div>` 
            : '';

          const priceHtml = (priceParts.length > 0) 
            ? `<div class="product-row-prices">${priceParts.join(' ')}</div>` 
            : '';

          const orderHtml = (orderStyleItems.length > 0) 
            ? `<div class="product-order-box">
                 <div class="product-order-box-title"><i class="fa-solid fa-boxes-stacked"></i> 下單總數</div>
                 ${orderStyleItems.map(itemStr => `<div class="product-order-item">• ${itemStr}</div>`).join('')}
               </div>` 
            : '';

          const noteHtml = (globalNote && globalNote.trim() !== '') 
            ? `<div class="product-row-note"><span>備註: ${globalNote}</span></div>` 
            : '';

          const linkHtml = (link && link.trim() !== '') 
            ? `<div class="product-row-link"><a href="${link}" target="_blank" style="color: #3498db; text-decoration: none;"><i class="fa-solid fa-link"></i> 連結</a></div>` 
            : '';

          const imageHtml = image 
            ? `<div class="product-image-container">
                 <img src="${image}" class="product-image" referrerpolicy="no-referrer" 
                      onload="this.closest('.product-image-container').style.display='flex';"
                      onerror="
                        if (this.src.endsWith('.png')) {
                          this.src = this.src.replace('.png', '.jpg');
                        } else if (this.src.endsWith('.jpg')) {
                          this.src = this.src.replace('.jpg', '.png');
                        } else {
                          this.closest('.product-image-container').style.display='none';
                        }
                      ">
               </div>` 
            : '';

          html += `
            <div class="product-card">
              <div class="product-row-1">
                <div class="product-titles">
                  <h4>
                    ${isItemAllCompleted ? '<i class="fa-solid fa-circle-check completed-icon"></i>' : ''}
                    ${prodName}${itemJp ? `<span class="jp-title-inline">(${itemJp})</span>` : ''}
                  </h4>
                </div>
              </div>

              ${styleHtml}
              ${priceHtml}
              ${orderHtml}
              ${noteHtml}
              ${linkHtml}
              ${imageHtml}

              ${itemOrders.length > 0 ? `
                <div class="sub-box">
                  <span class="sub-title order"><i class="fa-solid fa-cart-shopping"></i> 下單區塊</span>
                  ${(() => {
                    const buyerMap = {};
                    itemOrders.forEach(o => {
                      const bName = o.buyer || '未知';
                      if (!buyerMap[bName]) buyerMap[bName] = [];
                      buyerMap[bName].push(o);
                    });

                    return Object.keys(buyerMap).map(bName => {
                      const orders = buyerMap[bName];
                      const completedBuyerCount = orders.filter(o => checkedMap[o.id]).length;
                      
                      const buyerKey = `${storeName}_${prodName}_${bName}`;
                      const isBuyerOpen = (expandedBuyers[buyerKey] === undefined) ? true : expandedBuyers[buyerKey];

                      return `
                        <div class="buyer-group ${isBuyerOpen ? 'open' : ''}">
                          <div class="buyer-group-title" onclick="toggleBuyerElement(this, '${buyerKey}')">
                            <span><i class="fa-regular fa-user"></i> 下單人: ${bName}</span>
                            <div style="display: flex; align-items: center; gap: 8px;">
                              <span class="buyer-progress-badge">採購進度: ${completedBuyerCount}/${orders.length}</span>
                              <i class="fa-solid fa-chevron-down"></i>
                            </div>
                          </div>
                          <div class="buyer-items-container">
                            ${orders.map(o => {
                              const isDone = !!checkedMap[o.id];
                              const currentNoteVal = noteMap[o.id] !== undefined ? noteMap[o.id] : (o.note || '');
                              
                              let displayText = (o.style && o.style !== '-') ? `${o.style}+${o.qty}` : `數量: ${o.qty}`;
                              
                              return `
                                <div class="sub-row ${isDone ? 'completed' : ''}" onclick="toggleCheck('${o.id}')">
                                  <input type="checkbox" class="custom-checkbox" ${isDone ? 'checked' : ''} onclick="event.stopPropagation(); toggleCheck('${o.id}');">
                                  <div class="sub-content">
                                    <span class="sub-text"><strong>${displayText}</strong></span>
                                  </div>
                                  <input type="text" 
                                         class="note-input" 
                                         placeholder="輸入備註..." 
                                         value="${currentNoteVal.replace(/"/g, '&quot;')}" 
                                         onclick="event.stopPropagation();" 
                                         oninput="updateNote('${o.id}', this.value)" />
                                </div>
                              `;
                            }).join('')}
                          </div>
                        </div>
                      `;
                    }).join('');
                  })()}
                </div>
              ` : ''}
            </div>
          `;
        });

        html += `</div></div>`;
      });

      html += `</div>`;
      container.innerHTML = html;
    }
  </script>
</body>
</html>
